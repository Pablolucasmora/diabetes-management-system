name: diabetes_deploy

services:
  db:
    image: postgres:17
    container_name: deploy_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  # One-shot service: applies the schema bootstrap (init_db) with the
  # migrations identity and exits. It is the only service that receives
  # MIGRATIONS_DATABASE_URL, from its own .env.migrations (infra_conventions §14).
  # The "migrate" profile keeps it out of a plain `up`: scripts/deploy.sh runs
  # it explicitly with `run --rm` before touching web.
  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: Dockerfile.fasthtml
    env_file:
      - .env.prod
      - .env.migrations
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_RUNTIME_ROLE=${DB_RUNTIME_ROLE}
      - APP_ENV=${APP_ENV}
    command: python -m DayBetes_food.database.db_init
    # It must run once per deploy and stop, never be restarted.
    restart: "no"
    depends_on:
      db:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.fasthtml
    container_name: deploy_web
    env_file: .env.prod
    # The same variables build the connection URL. The app never migrates in
    # production and never receives the migrations identity (§14).
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_RUNTIME_ROLE=${DB_RUNTIME_ROLE}
      - APP_ENV=${APP_ENV}
      - DB_INIT_ON_STARTUP=false
    command: uvicorn DayBetes_food.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started

  tunnel:
    image: cloudflare/cloudflared:2026.2.0
    container_name: deploy_tunnel
    restart: unless-stopped
    command: tunnel --protocol http2 --config /etc/cloudflared/daybetes.yml run daybetes
    depends_on:
      - web
    volumes:
      - /etc/cloudflared:/home/nonroot/.cloudflared:ro
      - ./cloudflared/daybetes.yml:/etc/cloudflared/daybetes.yml:ro

volumes:
  pgdata_prod:
