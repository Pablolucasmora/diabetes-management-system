services:
  db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    container_name: diabetes_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    # Only this machine reaches the development database, also on a public wifi.
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: 
      context: .
      dockerfile: Dockerfile.fasthtml
    container_name: diabetes_app
    volumes:
      - .:/app
    # Only this machine by default. To try the app from the phone on the same
    # network: WEB_BIND_ADDRESS=0.0.0.0 docker compose up -d
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    # The same variables build the connection URL
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATIONS_DATABASE_URL=${MIGRATIONS_DATABASE_URL}
      - DB_RUNTIME_ROLE=${DB_RUNTIME_ROLE}
    command: uvicorn DayBetes_food.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_started

  tailwind:

    build:
      context: .
      dockerfile: Dockerfile.tailwind
    container_name: diabetes_tailwind
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    command: tailwindcss -i DayBetes_food/static/css/input.css -o DayBetes_food/static/css/output.css --watch

volumes:
  pgdata_dev:
