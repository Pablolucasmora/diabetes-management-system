# Dependency audit and production deploy (infra_conventions §13).
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" button to retry a failed deploy.
  workflow_dispatch:

# Least privilege: the Action's GitHub token can only read the repository.
permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit hash: a tag such as v7 can be moved to other
      # code; a hash cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pip-audit
      - run: pip-audit -r requirements.txt

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet --require-hashes -r requirements.txt
      - run: pip install --quiet -r requirements-dev.txt
      # Pure logic of domain/ (code_conventions.md, preamble): no database.
      - run: python -m pytest
      # The smart macros parser of Python against the cases shared with JS.
      - run: python scripts/check_smart_macros.py

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The images are built as the VPS builds them, so a base image or a lock
      # that does not install fails here and not in the deploy (infra §10).
      - run: docker build --quiet -f Dockerfile.fasthtml -t daybetes-web:ci .
      - run: docker build --quiet -f Dockerfile.tailwind -t daybetes-tailwind:ci .
      # The images Compose pulls must exist with their pinned digest.
      - name: Pull the Compose images
        run: |
          grep -hoE 'image: *[^ ]+@sha256:[0-9a-f]+' docker-compose.yml docker-compose.prod.yml \
            | awk '{print $2}' | sort -u | xargs -n1 docker pull --quiet

  deploy:
    name: Deploy to the VPS
    needs: [audit, tests, images]
    # Pull requests are only audited; only main is deployed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The secrets live in the "production" environment, which only allows main.
    environment: production
    # Two merges in a row never deploy at the same time: the second one waits.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS host key is pinned: never StrictHostKeyChecking=no.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # The command is forced by authorized_keys on the VPS; none is sent here.
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST"
