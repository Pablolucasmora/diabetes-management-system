# Dependabot proposes, as pull requests, the updates of every pinned
# dependency (infra_conventions.md §10): Python packages, base images and
# GitHub Actions. Each one goes through pip-audit and a manual test before
# it is merged.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
